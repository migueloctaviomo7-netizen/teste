{% extends "base.html" %}
{% block title %}Entrar | BarberTime{% endblock %}
{% block content %}
<section class="form-page">
    <form class="form-card" action="{{ url_for('login') }}" method="post">
        <p class="eyebrow">QUE BOM TER VOCÊ AQUI</p>
        <h1>Entrar na conta</h1>
        <p class="muted">Acesse para marcar seu próximo horário.</p>

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" maxlength="128" autocomplete="current-password" required>

        <button class="btn btn-full" type="submit">Entrar</button>
        <p class="form-foot">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
    </form>
</section>
{% endblock %}
